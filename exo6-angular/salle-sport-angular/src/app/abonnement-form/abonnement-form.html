<section class="abonnement-form-page">

  <div class="abonnement-container">


    <!-- HEADER -->

    <div class="page-header">

      <p class="page-label">
        FITNESS · GESTION
      </p>

      <h1>
        Ajouter
        <span>un abonnement.</span>
      </h1>

      <p>
        Créez un nouvel abonnement et associez-le à un adhérent.
      </p>

    </div>


    <!-- FORMULAIRE -->

    <div class="form-card">

      <div class="form-card-header">

        <div>

          <p class="form-label">
            NOUVEL ABONNEMENT
          </p>

          <h2>
            Informations de l'abonnement
          </h2>

        </div>

        <div class="form-icon">
          💳
        </div>

      </div>


      <form
        (ngSubmit)="creerAbonnement()"
      >


        <!-- TYPE -->

        <div class="form-group">

          <label for="type">
            TYPE D'ABONNEMENT
          </label>

          <select
            id="type"
            name="type"
            [(ngModel)]="abonnement.type"
            required
          >

            <option value="">
              Sélectionner un type
            </option>

            <option value="Mensuel">
              Mensuel
            </option>

            <option value="Trimestriel">
              Trimestriel
            </option>

            <option value="Annuel">
              Annuel
            </option>

          </select>

        </div>


        <!-- DATES -->

        <div class="form-row">


          <div class="form-group">

            <label for="dateDebut">
              DATE DE DÉBUT
            </label>

            <input
              type="date"
              id="dateDebut"
              name="dateDebut"
              [(ngModel)]="abonnement.dateDebut"
              required
            >

          </div>


          <div class="form-group">

            <label for="dateFin">
              DATE DE FIN
            </label>

            <input
              type="date"
              id="dateFin"
              name="dateFin"
              [(ngModel)]="abonnement.dateFin"
              required
            >

          </div>


        </div>


        <!-- ADHÉRENT -->

        <div class="form-group">

          <label for="adherent">
            ADHÉRENT
          </label>

          <select
            id="adherent"
            name="adherentId"
            [(ngModel)]="abonnement.adherentId"
            required
          >

            <option [ngValue]="0">
              Sélectionner un adhérent
            </option>

            <option
              *ngFor="let adherent of adherents"
              [ngValue]="adherent.id"
            >
              {{ adherent.nom }} {{ adherent.prenom }}
            </option>

          </select>

        </div>


        <!-- BOUTON -->

        <button
          type="submit"
          class="submit-button"
        >

          <span>
            Créer l'abonnement
          </span>

          <strong>
            →
          </strong>

        </button>

      </form>


      <!-- ERREUR -->

      <p
        *ngIf="error"
        class="error"
      >

        <strong>!</strong>

        {{ error }}

      </p>


    </div>

  </div>

</section>
